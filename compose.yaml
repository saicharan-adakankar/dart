services:
  dart:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /data:size=1200m,uid=1000,gid=1000
    mem_limit: 768m
    cpus: 2
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
